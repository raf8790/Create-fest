<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased overflow-hidden flex flex-col">

    <div id="app" class="flex h-full w-full overflow-hidden">
        
        <!-- SIDEBAR NAVIGATION (Admin & General) -->
        <aside id="sidebar" class="w-72 bg-slate-800 border-r border-slate-700 flex flex-col z-20 transition-all duration-300 no-print flex-shrink-0">
            <div class="p-5 border-b border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">

                    <div>
                        <h1 id="sidebar-fest-name" class="font-bold text-base leading-tight tracking-wide text-white">FestMaster Pro</h1>

            <!-- Navigation Links -->
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1.5 text-sm font-medium">

                <button onclick="switchTab('dashboard')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="dashboard">
                    <i class="fa-solid fa-chart-pie w-5 text-center text-indigo-400"></i>

                <button onclick="switchTab('setup')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="setup">

                    <span>Fest Setup & Teams</span>

                <button onclick="switchTab('codeletters')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="codeletters">

                <button onclick="switchTab('scoring')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="scoring">

                    <span>Points & Result Entry</span>
                </button>

                <button onclick="switchTab('poster')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="poster">
                    <i class="fa-solid fa-image w-5 text-center text-cyan-400"></i>
                    <span>Result Poster Maker</span>
                </button>

                <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-3 pt-4 pb-2">Portals & Views</div>

                <button onclick="switchTab('public-portal')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="public-portal">
                    <i class="fa-solid fa-globe w-5 text-center text-teal-400"></i>
                    <span>Public Live Portal</span>
                </button>

                <button onclick="switchTab('team-portal')" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl transition-all text-slate-300 hover:bg-slate-700 hover:text-white" data-tab="team-portal">
                    <i class="fa-solid fa-shield-halved w-5 text-center text-orange-400"></i>

                </button>
            </nav>

            <!-- Storage & Backup status footer -->
            <div class="p-4 border-t border-slate-700 bg-slate-900/50 flex flex-col space-y-2">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span class="flex items-center space-x-1.5"><i class="fa-solid fa-database text-emerald-400"></i><span>Local Storage</span></span>
                    <span id="storage-status" class="text-emerald-400 font-semibold">Active & Saved</span>
                </div>
                <div class="flex space-x-2">
                    <button onclick="exportData()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-1.5 px-2 rounded border border-slate-700 transition"><i class="fa-solid fa-download mr-1"></i> Export</button>
                    <label class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-1.5 px-2 rounded border border-slate-700 transition text-center cursor-pointer">
                        <i class="fa-solid fa-upload mr-1"></i> Import <input type="file" id="import-file" class="hidden" onchange="importData(event)">
                    </label>
                </div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">

            <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between z-10 no-print">

                    <h2 id="current-page-title" class="text-lg font-bold text-white tracking-wide">Dashboard</h2>
                </div>
                <div class="flex items-center space-x-3">
                    <div id="top-fest-badge" class="hidden sm:flex items-center space-x-2 bg-indigo-500/10 border border-indigo-500/30 px-3 py-1.5 rounded-full text-xs font-medium text-indigo-300">
                        <i class="fa-solid fa-bullhorn text-indigo-400"></i>
                        <span id="header-fest-title">College Arts Fest 2026</span>
                    </div>
                    <button onclick="resetAllDataConfirmation()" class="text-slate-400 hover:text-rose-400 text-xs bg-slate-800 hover:bg-slate-800/80 border border-slate-700 px-3 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-trash-can mr-1"></i> Reset Data
                    </button>
                </div>
            </header>

            <!-- Content Scroll Area -->
            <div id="content-area" class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Dynamic tabs injected via JS -->
            </div>
        </main>
    </div>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modal-icon" class="w-10 h-10 rounded-xl flex items-center justify-center text-lg bg-indigo-500/20 text-indigo-400">
                    <i class="fa-solid fa-info"></i>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-white">Notification</h3>
            </div>
            <p id="modal-message" class="text-sm text-slate-300 mb-6 leading-relaxed">Message goes here...</p>
            <div id="modal-actions" class="flex justify-end space-x-3">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-semibold rounded-xl transition">Close</button>
            </div>
        </div>
    </div>

    <!-- MAIN JAVASCRIPT APP LOGIC -->
    <script>
        
        // Default App State
        let defaultState = {
            festName: "Symphony Arts Fest 2026",
            festSubtitle: "Inter-College Cultural Extravaganza",
            venue: "Main Auditorium",
            date: "2026-04-15",
            teams: [
                { id: "team-1", name: "Phoenix Blazers", code: "PHX", color: "#f97316", points: 0 },
                { id: "team-2", name: "Royal Titans", code: "ROY", color: "#3b82f6", points: 0 },
                { id: "team-3", name: "Emerald Strikers", code: "EMR", color: "#10b981", points: 0 },
                { id: "team-4", name: "Mystic Royals", code: "MYS", color: "#a855f7", points: 0 }
            ],
            codeLetters: [
                { id: "cl-1", code: "DAN", name: "Dance Category", prefix: "D" },
                { id: "cl-2", code: "MUS", name: "Music Category", prefix: "M" },
                { id: "cl-3", code: "LIT", name: "Literary Category", prefix: "L" },
                { id: "cl-4", code: "THR", name: "Theatre & Drama", prefix: "T" },
                { id: "cl-5", code: "ART", name: "Fine Arts", prefix: "A" }
            ],
            chestNumberConfig: {
                prefixFormat: "{CODE}-{NUM}",
                startNumber: 101,
                autoAssign: true
            },
            events: [
                { id: "ev-1", name: "Western Dance (Group)", category: "DAN", type: "Group", points1st: 10, points2nd: 7, points3rd: 5 },
                { id: "ev-2", name: "Light Music (Solo)", category: "MUS", type: "Solo", points1st: 5, points2nd: 3, points3rd: 1 },
                { id: "ev-3", name: "Debate English", category: "LIT", type: "Solo", points1st: 5, points2nd: 3, points3rd: 1 },
                { id: "ev-4", name: "Mono Act", category: "THR", type: "Solo", points1st: 5, points2nd: 3, points3rd: 1 },
                { id: "ev-5", name: "Oil Painting", category: "ART", type: "Solo", points1st: 5, points2nd: 3, points3rd: 1 }
            ],
            participants: [
                { id: "p-1", name: "Aleena Roy", chestNo: "DAN-101", teamId: "team-1", category: "DAN", eventId: "ev-1" },
                { id: "p-2", name: "Rahul Dev", chestNo: "MUS-102", teamId: "team-2", category: "MUS", eventId: "ev-2" },
                { id: "p-3", name: "Ananya S", chestNo: "LIT-103", teamId: "team-3", category: "LIT", eventId: "ev-3" }
            ],
            results: [
                // eventId, 1st (participantId or teamId/name), 2nd, 3rd
                { eventId: "ev-2", first: "p-2", second: "p-1", third: "p-3" }
            ],
            activeTab: "dashboard",
            selectedTeamPortalId: "team-1"
        };

        let state = JSON.parse(localStorage.getItem('festmaster_state')) || defaultState;

        function saveState() {
            // Recalculate team points before saving
            recalculatePoints();
            localStorage.setItem('festmaster_state', JSON.stringify(state));
            updateHeaderInfo();
        }

        function recalculatePoints() {
            // Reset team points
            state.teams.forEach(t => t.points = 0);

            // Compute points from results
            state.results.forEach(res => {
                const event = state.events.find(e => e.id === res.eventId);
                if (!event) return;

                if (res.first) {
                    const p = state.participants.find(part => part.id === res.first);
                    if (p) {
                        const team = state.teams.find(t => t.id === p.teamId);
                        if (team) team.points += (event.points1st || 5);
                    }
                }
                if (res.second) {
                    const p = state.participants.find(part => part.id === res.second);
                    if (p) {
                        const team = state.teams.find(t => t.id === p.teamId);
                        if (team) team.points += (event.points2nd || 3);
                    }
                }
                if (res.third) {
                    const p = state.participants.find(part => part.id === res.third);
                    if (p) {
                        const team = state.teams.find(t => t.id === p.teamId);
                        if (team) team.points += (event.points3rd || 1);
                    }
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            recalculatePoints();
            updateHeaderInfo();
            switchTab(state.activeTab || 'dashboard');
        });

        function updateHeaderInfo() {
            document.getElementById('sidebar-fest-name').innerText = state.festName;
            document.getElementById('header-fest-title').innerText = state.festName;
        }

        function switchTab(tabId) {
            state.activeTab = tabId;
            saveState();

            // Update active state on nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
                    btn.classList.remove('text-slate-300', 'hover:bg-slate-700', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-600/20');
                    btn.classList.add('text-slate-300', 'hover:bg-slate-700', 'hover:text-white');
                }
            });

            const titles = {
                'dashboard': 'Dashboard & Overview',
                'setup': 'Festival Setup & Team Management',
                'codeletters': 'Code Letters & Chest Number Configuration',
                'events': 'Events Management',
                'registrations': 'Participant Registrations',
                'scoring': 'Points & Result Entry',
                'poster': 'Result Poster Generator',
                'public-portal': 'Public Live Scoreboard Portal',
                'team-portal': 'Team Portal Dashboard'
            };

            document.getElementById('current-page-title').innerText = titles[tabId] || 'FestMaster';
            renderTabContent(tabId);
        }

        function renderTabContent(tabId) {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            switch(tabId) {
                case 'dashboard':
                    container.innerHTML = renderDashboardHTML();
                    break;
                case 'setup':
                    container.innerHTML = renderSetupHTML();
                    break;
                case 'codeletters':
                    container.innerHTML = renderCodeLettersHTML();
                    break;
                case 'events':
                    container.innerHTML = renderEventsHTML();
                    break;
                case 'registrations':
                    container.innerHTML = renderRegistrationsHTML();
                    break;
                case 'scoring':
                    container.innerHTML = renderScoringHTML();
                    break;
                case 'poster':
                    container.innerHTML = renderPosterHTML();
                    break;
                case 'public-portal':
                    container.innerHTML = renderPublicPortalHTML();
                    break;
                case 'team-portal':
                    container.innerHTML = renderTeamPortalHTML();
                    break;
                default:
                    container.innerHTML = '<div class="text-slate-400">Tab not found</div>';
            }
        }

        // --- 1. DASHBOARD ---
        function renderDashboardHTML() {
            recalculatePoints();
            const sortedTeams = [...state.teams].sort((a,b) => b.points - a.points);
            const leader = sortedTeams[0] || { name: 'N/A', points: 0 };

            return `
            <div class="space-y-6 max-w-7xl mx-auto">
                <!-- Top banner -->
                <div class="bg-gradient-to-r from-indigo-900/60 via-purple-900/40 to-slate-900 border border-indigo-500/30 rounded-3xl p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center shadow-xl relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="space-y-2 z-10">
                        <span class="bg-indigo-500/20 text-indigo-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-500/30">Live Festival Suite</span>
                        <h2 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">${state.festName}</h2>
                        <p class="text-slate-300 text-sm max-w-xl">${state.festSubtitle} • Venue: <span class="text-indigo-300 font-medium">${state.venue}</span> • Date: <span class="text-indigo-300 font-medium">${state.date}</span></p>
                    </div>
                    <div class="mt-6 md:mt-0 z-10 flex space-x-3">
                        <button onclick="switchTab('scoring')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-5 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition flex items-center space-x-2 text-sm">
                            <i class="fa-solid fa-award"></i><span>Enter Results</span>
                        </button>
                        <button onclick="switchTab('public-portal')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-5 py-2.5 rounded-xl border border-slate-700 transition flex items-center space-x-2 text-sm">
                            <i class="fa-solid fa-globe"></i><span>Public View</span>
                        </button>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Teams</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.teams.length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/20 rounded-xl flex items-center justify-center text-indigo-400 text-xl"><i class="fa-solid fa-shield-halved"></i></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Registered Participants</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.participants.length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-purple-500/10 border border-purple-500/20 rounded-xl flex items-center justify-center text-purple-400 text-xl"><i class="fa-solid fa-users"></i></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Events</p>
                            <h3 class="text-2xl font-bold text-white mt-1">${state.events.length}</h3>
                        </div>
                        <div class="w-12 h-12 bg-blue-500/10 border border-blue-500/20 rounded-xl flex items-center justify-center text-blue-400 text-xl"><i class="fa-solid fa-calendar-days"></i></div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex items-center justify-between shadow-sm">
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Current Leader</p>
                            <h3 class="text-xl font-bold text-amber-400 mt-1 truncate max-w-[150px]">${leader.name}</h3>
                        </div>
                        <div class="w-12 h-12 bg-amber-500/10 border border-amber-500/20 rounded-xl flex items-center justify-center text-amber-400 text-xl"><i class="fa-solid fa-crown"></i></div>
                    </div>
                </div>

                <!-- Live Leaderboard Preview -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="font-bold text-lg text-white flex items-center space-x-2"><i class="fa-solid fa-ranking-star text-indigo-400"></i><span>Live Team Standings</span></h3>
                            <button onclick="switchTab('scoring')" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold">View All Scores &rarr;</button>
                        </div>
                        <div class="space-y-3">
                            ${sortedTeams.map((team, index) => `
                                <div class="flex items-center justify-between p-4 rounded-xl bg-slate-800/50 border border-slate-800 hover:border-slate-700 transition">
                                    <div class="flex items-center space-x-4">
                                        <span class="w-7 h-7 rounded-lg flex items-center justify-center font-bold text-xs ${index === 0 ? 'bg-amber-500 text-slate-950 font-extrabold' : index === 1 ? 'bg-slate-300 text-slate-950' : index === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-slate-400'}">${index + 1}</span>
                                        <div class="w-3 h-3 rounded-full" style="background-color: ${team.color}"></div>
                                        <div>
                                            <h4 class="font-semibold text-white text-sm">${team.name}</h4>
                                            <span class="text-xs text-slate-400 font-mono">Code: ${team.code}</span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-lg font-extrabold text-indigo-400">${team.points}</span>
                                        <span class="text-xs text-slate-400 block">Pts</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Quick Actions Panel -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-lg text-white mb-4 flex items-center space-x-2"><i class="fa-solid fa-bolt text-amber-400"></i><span>Quick Shortcuts</span></h3>
                            <div class="space-y-2.5">
                                <button onclick="switchTab('registrations')" class="w-full text-left px-4 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-200 text-sm font-medium flex items-center justify-between border border-slate-700/60 transition">
                                    <span class="flex items-center space-x-3"><i class="fa-solid fa-user-plus text-purple-400"></i><span>Register New Participant</span></span>
                                    <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
                                </button>
                                <button onclick="switchTab('events')" class="w-full text-left px-4 py-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-200 text-sm font-medium flex items-center justify-between border border-slate-700/60 transition">
                                    <span class="flex items-center space-x-3"><i class="fa-solid fa-calendar-plus text-blue-400"></i><span>Add New Festival Event</span></span>

            const color = document.getElementById('modal-team-color').value;

            if (!name || !code) {

                return;

            if (isEdit) {

                if (team) {

                    team.code = code;
                    team.color = color;

        function renderParticipantsTableRows(parts) {
            if (parts.length === 0) {

            }
            return parts.map(p => {
                const team = state.teams.find(t => t.id === p.teamId);
                const event = state.events.find(e => e.id === p.eventId);
                return `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="px-4 py-3 font-mono font-bold text-indigo-400">${p.chestNo}</td>
                    <td class="px-4 py-3 font-semibold text-white">${p.name}</td>
                    <td class="px-4 py-3"><span class="inline-flex items-center space-x-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: ${team ? team.color : '#fff'}"></span><span>${team ? team.name : 'Unknown'}</span></span></td>
                    <td class="px-4 py-3">${event ? event.name : 'Unknown'}</td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="deleteParticipant('${p.id}')" class="p-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 rounded-lg text-xs transition"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function registerParticipant(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const teamId = document.getElementById('reg-team').value;
            const eventId = document.getElementById('reg-event').value;
            const eventObj = state.events.find(ev => ev.id === eventId);
            if (!eventObj) return;

            // Generate Chest Number
            const countForCat = state.participants.filter(p => p.category === eventObj.category).length + 1;
            const startNo = state.chestNumberConfig.startNumber || 101;
            const num = startNo + countForCat - 1;
            const chestNo = state.chestNumberConfig.prefixFormat === 'NUM' ? `${num}` : `${eventObj.category}-${num}`;

            const newPart = {
                id: 'p-' + Date.now(),
                name,
                chestNo,
                teamId,
                category: eventObj.category,
                eventId
            };

            state.participants.push(newPart);
            saveState();
            renderTabContent('registrations');
            showModal('Success', `Participant registered successfully with Chest No: ${chestNo}`, 'success');
        }

        function deleteParticipant(id) {
            state.participants = state.participants.filter(p => p.id !== id);
            saveState();
            renderTabContent('registrations');
        }

        function filterParticipants() {
            const query = document.getElementById('search-participant').value.toLowerCase();
            const filtered = state.participants.filter(p => p.name.toLowerCase().includes(query) || p.chestNo.toLowerCase().includes(query));
            document.getElementById('participants-table-body').innerHTML = renderParticipantsTableRows(filtered);

        function resetAllDataConfirmation() {
            if (confirm('Are you sure you want to reset all festival data to default?')) {
                localStorage.removeItem('festmaster_state');
                state = JSON.parse(JSON.stringify(defaultState));
                saveState();
                switchTab('dashboard');
                showModal('Reset Complete', 'All festival data has been reset to defaults.', 'success');
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `festmaster_backup_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(e) {
            const fileReader = new FileReader();
            if (e.target.files[0]) {
                fileReader.readAsText(e.target.files[0], "UTF-8");
                fileReader.onload = event => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        state = parsed;
                        saveState();
                        switchTab('dashboard');
                        showModal('Success', 'Festival data successfully imported!', 'success');
                    } catch (err) {
                        showModal('Error', 'Invalid backup JSON file format.', 'error');
