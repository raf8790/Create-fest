<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fest Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-trophy mr-2"></i> Fest Manager Pro</h1>
        <div class="space-x-4">
            <button onclick="switchTab('register')" class="hover:underline">Registration</button>
            <button onclick="switchTab('teams')" class="hover:underline">Teams & Code</button>
            <button onclick="switchTab('judging')" class="hover:underline">Judge Scoring</button>
            <button onclick="switchTab('public')" class="hover:underline font-semibold bg-indigo-700 px-3 py-1 rounded">Public Portal</button>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        
        <!-- 1. REGISTRATION & CHEST NUMBER SECTION -->
        <section id="register-section" class="tab-content bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-bold mb-4 text-indigo-600">Participant Registration & Chest Number</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input type="text" id="p-name" placeholder="Participant Name" class="border p-2 rounded w-full">
                <select id="p-team" class="border p-2 rounded w-full">
                    <option value="Team Alpha">Team Alpha</option>
                    <option value="Team Beta">Team Beta</option>
                    <option value="Team Gamma">Team Gamma</option>
                </select>
                <input type="text" id="p-chest" placeholder="Chest No (e.g., A-101)" class="border p-2 rounded w-full">
            </div>
            <button onclick="registerParticipant()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Save Participant</button>
            
            <div class="mt-6">
                <h3 class="font-bold text-lg mb-2">Registered List</h3>
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse border border-gray-200 text-left">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="border p-2">Chest No</th>
                                <th class="border p-2">Name</th>
                                <th class="border p-2">Team</th>
                            </tr>
                        </thead>
                        <tbody id="participant-table-body">
                            <!-- Dynamic Data -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 2. JUDGE SCORING SECTION -->
        <section id="judging-section" class="tab-content bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4 text-indigo-600">Judge Point Entry</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <select id="score-chest" class="border p-2 rounded w-full">
                    <!-- Populated dynamically -->
                </select>
                <input type="text" id="score-item" placeholder="Event Name (e.g., Oppana)" class="border p-2 rounded w-full">
                <input type="number" id="score-points" placeholder="Points / Mark" class="border p-2 rounded w-full">
            </div>
            <button onclick="addScore()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Submit Points</button>
        </section>

        <!-- 3. PUBLIC & TEAM PORTAL SECTION -->
        <section id="public-section" class="tab-content bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4 text-indigo-600">Live Results & Public Portal</h2>
            <div id="live-results" class="space-y-2">
                <!-- Live results will appear here -->
            </div>
        </section>

    </div>

    <script>
        // LocalStorage fallback so data doesn't wipe on back/refresh
        let participants = JSON.parse(localStorage.getItem('fest_participants')) || [];
        let scores = JSON.parse(localStorage.getItem('fest_scores')) || [];

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            if(tabId === 'register') document.getElementById('register-section').classList.remove('hidden');
            if(tabId === 'judging') document.getElementById('judging-section').classList.remove('hidden');
            if(tabId === 'public') {
                document.getElementById('public-section').classList.remove('hidden');
                renderPublicResults();
            }
            updateDropdowns();
        }

        function registerParticipant() {
            const name = document.getElementById('p-name').value;
            const team = document.getElementById('p-team').value;
            const chest = document.getElementById('p-chest').value;

            if(!name || !chest) {
                alert('कृपया എല്ലാ വിവരങ്ങളും നൽകുക!');
                return;
            }

            participants.push({ name, team, chest });
            localStorage.setItem('fest_participants', JSON.stringify(participants));
            
            document.getElementById('p-name').value = '';
            document.getElementById('p-chest').value = '';
            renderParticipants();
            alert('വിജയകരമായി രജിസ്റ്റർ ചെയ്തു!');
        }

        function renderParticipants() {
            const tbody = document.getElementById('participant-table-body');
            tbody.innerHTML = '';
            participants.forEach(p => {
                tbody.innerHTML += `<tr><td class="border p-2">${p.chest}</td><td class="border p-2">${p.name}</td><td class="border p-2">${p.team}</td></tr>`;
            });
        }

        function updateDropdowns() {
            const select = document.getElementById('score-chest');
            select.innerHTML = '';
            participants.forEach(p => {
                select.innerHTML += `<option value="${p.chest}">${p.chest} - ${p.name}</option>`;
            });
        }

        function addScore() {
            const chest = document.getElementById('score-chest').value;
            const item = document.getElementById('score-item').value;
            const points = document.getElementById('score-points').value;

            if(!item || !points) {
                alert('ഇവന്റും പോയിന്റും നൽകുക!');
                return;
            }

            const participant = participants.find(p => p.chest === chest);
            scores.push({ chest, name: participant ? participant.name : 'Unknown', item, points });
            localStorage.setItem('fest_scores', JSON.stringify(scores));
            
            document.getElementById('score-item').value = '';
            document.getElementById('score-points').value = '';
            alert('പോയിന്റ് വിജയകരമായി ചേർത്തു!');
        }

        function renderPublicResults() {
            const container = document.getElementById('live-results');
            container.innerHTML = '';
            if(scores.length === 0) {
                container.innerHTML = '<p class="text-gray-500">ഇതുവരെ റിസൾട്ടുകൾ ഒന്നും അപ്ഡേറ്റ് ചെയ്തിട്ടില്ല.</p>';
                return;
            }
            scores.forEach(s => {
                container.innerHTML += `
                    <div class="p-3 border rounded flex justify-between items-center bg-gray-50">
                        <div>
                            <span class="font-bold text-indigo-600">${s.item}</span> - ${s.name} (${s.chest})
                        </div>
                        <span class="bg-green-100 text-green-800 px-3 py-1 rounded font-bold">${s.points} Pts</span>
                    </div>
                `;
            });
        }

        // Initial load
        renderParticipants();
    </script>
</body>
</html>
